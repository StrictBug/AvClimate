services:
  - type: web
    name: avclimate
    env: python
    plan: free
    autoDeploy: true
    buildCommand: bash scripts/helpers/bootstrap_data_from_release.sh && python scripts/helpers/split_fog_wind_by_mode.py && pip install -r webapp/requirements.txt
    envVars:
      - key: CHARTS_MEMORY_GUARD_MB
        value: "430"
      - key: AVCLIMATE_RELEASE_BASE_URL
        sync: false
      - key: AVCLIMATE_BY_ICAO_URL
        sync: false
      - key: AVCLIMATE_LIGHTNING_URL
        sync: false
      - key: AVCLIMATE_BY_ICAO_SHA256
        sync: false
      - key: AVCLIMATE_LIGHTNING_SHA256
        sync: false
      - key: GITHUB_TOKEN
        sync: false
    startCommand: bash scripts/helpers/start_render.sh
    healthCheckPath: /api/options
